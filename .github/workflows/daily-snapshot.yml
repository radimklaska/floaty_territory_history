name: Daily territory snapshot

on:
  schedule:
    # 00:17 UTC: after Floaty republishes changed territory tiles (~:02 past
    # each hour), and off the top of the hour, when GitHub's scheduler is busiest
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Take snapshot
        run: node snapshot.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily latest.json
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -q -m "Territory snapshot $(date -u +%F)" -m "$(node -p "const t=require('./latest.json').totals; t.cells+' cells, '+t.clubs+' clubs'")"
          git push
