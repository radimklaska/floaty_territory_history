<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Floaty territory history has moved</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://floaty.klaska.net/" />
<!-- The map moved to floaty.klaska.net (Cloudflare). GitHub Pages can't send a
     301, so this page redirects in JS, keeping ?query and #d=…&c=… link state;
     the meta refresh is the no-JS fallback (it drops the #state). -->
<script>location.replace('https://floaty.klaska.net/' + location.search + location.hash);</script>
<meta http-equiv="refresh" content="0; url=https://floaty.klaska.net/" />
</head>
<body>
<p>The Floaty territory map has moved to <a href="https://floaty.klaska.net/">floaty.klaska.net</a>.</p>
</body>
</html>
